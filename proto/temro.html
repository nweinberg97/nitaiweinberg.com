<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Temro: try it</title>
<style>
/* A clickable Mac prototype of Temro: the ⌥ Space launcher, time blocks that hand off, Pomodoro and focus sounds. */
:root{--night:#161412;--coal:#1F1C1A;--ash:#2A2724;--raise:#33302C;--ember:#F2A36E;--ember-hot:#F7B98C;--ember-deep:#C9774A;--ember-wash:rgba(242,163,110,.14);
--cream:#F4EEE6;--muted:#A69D93;--faint:#6F675F;--line:rgba(244,238,230,.09);--mint:#7fd3a6;
--sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;background:#161412}
body{font:15px/1.45 var(--sans);color:var(--cream);-webkit-font-smoothing:antialiased;padding:4px 0 26px}
button{font:inherit;color:inherit}

/* laptop */
.laptop{width:min(100% - 8%,980px);margin:0 auto}
.lid{background:#0d0d0e;border-radius:18px 18px 6px 6px;padding:2.2% 2.2% 3.2%;box-shadow:0 0 0 1.5px #3a3a3c,inset 0 0 0 1px #222;position:relative}
.cam{position:absolute;top:.9%;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:#222;box-shadow:inset 0 0 0 1.5px #333}
.scr{position:relative;aspect-ratio:16/10;overflow:hidden;border-radius:4px;background:#000}
.base{height:16px;margin:0 -7%;background:linear-gradient(#cfd0d3,#9fa1a5 60%,#7c7e82);border-radius:2px 2px 14px 14px;position:relative;box-shadow:0 18px 30px -18px rgba(0,0,0,.7)}
.base::before{content:"";position:absolute;left:50%;top:0;width:14%;height:6px;margin-left:-7%;background:#8b8d91;border-radius:0 0 8px 8px}
.under{display:flex;justify-content:center;align-items:center;gap:10px;margin-top:16px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.seg{display:inline-flex;background:var(--ash);border-radius:999px;padding:3px}
.seg button{all:unset;cursor:pointer;padding:5px 12px;border-radius:999px;font-weight:600;font-size:12.5px;color:var(--muted)}
.seg button.on{background:var(--raise);color:var(--cream)}

/* desktop, drawn at 1280×800 and scaled to fit */
.desk{position:absolute;left:0;top:0;width:1280px;height:800px;transform-origin:0 0;
background:radial-gradient(120% 90% at 100% 100%,#7a4628 0%,#4a2d1d 30%,#2a1f19 60%,#1b1714 100%);overflow:hidden;user-select:none}
.mbar{position:absolute;top:0;left:0;right:0;height:28px;background:rgba(30,26,23,.55);backdrop-filter:blur(20px);display:flex;align-items:center;padding:0 14px;font-size:13.5px;gap:18px;z-index:20}
.mbar b{font-weight:700}
.mbar .sp{flex:1}
.mbar .it{opacity:.9}
.tmb{all:unset;cursor:pointer;display:flex;align-items:center;gap:6px;padding:2px 8px;border-radius:6px;font-variant-numeric:tabular-nums;font-weight:600}
.tmb:hover,.tmb.open{background:rgba(255,255,255,.14)}
.tmb img{width:16px;height:16px;border-radius:4px}
.tmb i{width:7px;height:7px;border-radius:50%;background:var(--ember)}
.mbar svg{height:13px}

/* a plain document window for context */
.win{position:absolute;left:150px;top:90px;width:640px;height:520px;background:#f7f5f2;border-radius:12px;box-shadow:0 30px 80px -20px rgba(0,0,0,.6);color:#2b2825;overflow:hidden;transition:filter .3s}
.win .tb{height:38px;background:#ecebe8;display:flex;align-items:center;gap:8px;padding:0 14px;border-bottom:1px solid #dcdad6;font-size:13px;color:#6b6762}
.win .tb i{width:12px;height:12px;border-radius:50%;background:#e0dcd6}
.win .tb span{margin-left:auto;margin-right:auto;font-weight:600}
.win .doc{padding:34px 54px;font-size:15px;line-height:1.7}
.win h4{margin:0 0 10px;font-size:24px}
.win .ln{height:10px;border-radius:5px;background:#e4e1dc;margin:12px 0}
.desk.dim .win{filter:brightness(.55) blur(1px)}

/* hint pill */
.hint{all:unset;cursor:pointer;position:absolute;left:50%;bottom:44px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:12px 20px;border-radius:999px;background:rgba(31,28,26,.88);backdrop-filter:blur(12px);box-shadow:0 0 0 1px var(--line),0 20px 40px -20px rgba(0,0,0,.8);font-size:16px;font-weight:600;transition:opacity .3s;animation:breathe 2.6s ease-in-out infinite}
.hint kbd{font:600 14px var(--sans);background:var(--ash);border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:2px 8px}
.hint.gone{opacity:0;pointer-events:none}
@keyframes breathe{50%{box-shadow:0 0 0 1px var(--line),0 0 0 8px rgba(242,163,110,.12),0 20px 40px -20px rgba(0,0,0,.8)}}

/* launcher */
.launch{position:absolute;left:50%;top:200px;width:820px;transform:translate(-50%,8px) scale(.98);opacity:0;pointer-events:none;background:rgba(31,28,26,.97);border-radius:20px;box-shadow:0 0 0 1px var(--line),0 40px 90px -20px rgba(0,0,0,.85);padding:22px 24px 16px;transition:opacity .2s,transform .2s;z-index:30}
.launch.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.lrow{display:flex;align-items:flex-start;gap:14px}
.lrow .dot{width:10px;height:10px;border-radius:50%;background:var(--ember);margin-top:13px;flex:none}
.lrow textarea{all:unset;flex:1;font-size:26px;line-height:1.35;color:var(--cream);caret-color:var(--ember);resize:none;overflow:hidden;white-space:pre-wrap;word-break:break-word}
.lrow textarea::placeholder{color:var(--faint)}
.lrow .x{all:unset;cursor:pointer;color:var(--muted);font-size:22px;padding:4px 6px;border-radius:6px}
.lrow .x:hover{background:var(--ash)}
.sugs{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.sug{all:unset;cursor:pointer;padding:7px 12px;border-radius:10px;background:var(--ash);font-size:14px;color:var(--muted)}
.sug:hover{color:var(--cream);background:var(--raise)}
.sug b{color:var(--ember);font-weight:600}
.prev{margin-top:14px;display:none}
.prev.on{display:block}
.phead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pchip{display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border-radius:10px;background:var(--ash);font-size:14.5px}
.pchip b{font-weight:650}.pchip span{color:var(--muted)}
.ret{margin-left:auto;color:var(--faint);font-size:14px;display:flex;align-items:center;gap:8px}
.ret kbd{font:600 12px var(--sans);background:var(--ash);border-radius:5px;padding:2px 6px;color:var(--muted)}
.blocks{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.blk{padding:6px 11px;border-radius:9px;background:var(--ash);font-size:14px;color:var(--muted)}
.blk b{color:var(--cream);font-weight:600;margin:0 6px}
.modes{display:inline-flex;margin-top:12px;background:var(--ash);border-radius:12px;padding:4px}
.modes button{all:unset;cursor:pointer;padding:8px 16px;border-radius:9px;color:var(--muted);font-weight:600}
.modes button.on{background:var(--raise);color:var(--cream)}
.lfoot{text-align:right;color:var(--faint);font-size:13px;margin-top:8px}
mark{background:rgba(242,163,110,.22);color:var(--cream);border-radius:4px;padding:0 2px}

/* session panel */
.panel{position:absolute;right:26px;top:44px;width:470px;background:rgba(31,28,26,.97);border-radius:18px;box-shadow:0 0 0 1px var(--line),0 30px 70px -20px rgba(0,0,0,.8);opacity:0;transform:translateY(-8px);pointer-events:none;transition:opacity .25s,transform .25s;z-index:25;overflow:hidden}
.panel.on{opacity:1;transform:none;pointer-events:auto}
.ph{display:flex;align-items:center;gap:12px;padding:16px 18px 10px}
.ph .dot{width:10px;height:10px;border-radius:50%;background:var(--ember);flex:none}
.ph .dot.br{background:var(--mint)}
.ph .nm{color:var(--muted);font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:170px}
.ph .tm{font-size:36px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.ph .ic{margin-left:auto;display:flex;gap:4px}
.ic button{all:unset;cursor:pointer;width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.ic button:hover{background:var(--ash);color:var(--cream)}
.ic svg{width:17px;height:17px}
.bar{height:4px;margin:0 18px;border-radius:2px;background:var(--ash);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ember);transition:width .5s linear}
.pbody{padding:10px 0 6px}
.sess{padding:2px 18px 6px;font-size:14.5px;color:var(--muted)}
.sess b{color:var(--cream)}
.bl{display:grid;grid-template-columns:22px 56px 1fr auto;align-items:center;padding:7px 18px;font-size:15px;color:var(--muted)}
.bl.done{text-decoration:line-through;opacity:.55}
.bl.done .ck{color:var(--ember);text-decoration:none}
.bl.cur{background:rgba(242,163,110,.08);color:var(--cream);font-weight:600}
.bl.cur .r{color:var(--ember)}
.bl .r{font-variant-numeric:tabular-nums}
.acts{display:flex;gap:16px;padding:8px 18px 10px;font-size:14.5px}
.acts button{all:unset;cursor:pointer;color:var(--muted);font-weight:600}
.acts button.e{color:var(--ember)}
.acts button:hover{color:var(--cream)}
.pomo{display:flex;align-items:center;gap:14px;padding:4px 18px 8px}
.pdots{display:flex;gap:5px;align-items:center}
.pdots i{width:8px;height:8px;border-radius:4px;background:var(--raise)}
.pdots i.d{background:var(--ember-deep)}
.pdots i.c{width:22px;background:var(--ember)}
.pomo b{display:block;font-size:16px}.pomo small{color:var(--muted);font-size:13.5px}
.snd{display:flex;align-items:center;gap:12px;padding:12px 18px;border-top:1px solid var(--line);font-size:15px}
.snd svg{width:18px;height:18px;color:var(--muted)}
.snd select{all:unset;cursor:pointer;margin-left:auto;font-weight:600;padding:2px 4px;border-radius:6px}
.snd select option{color:#000}
.tog{all:unset;cursor:pointer;width:42px;height:24px;border-radius:12px;background:var(--raise);position:relative;transition:background .2s}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#bdb5ab;transition:transform .2s,background .2s}
.tog.on{background:var(--ember-deep)}.tog.on::after{transform:translateX(18px);background:#fff}
.pfoot{display:flex;align-items:center;gap:18px;padding:10px 18px 14px;font-size:14.5px}
.pfoot button{all:unset;cursor:pointer;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px}
.pfoot button.e{color:var(--ember)}
.pfoot button:hover{color:var(--cream)}
.pfoot .hd{margin-left:auto}

/* menu bar dropdown */
.drop{position:absolute;top:34px;width:420px;background:rgba(31,28,26,.97);border-radius:14px;box-shadow:0 0 0 1px var(--line),0 30px 70px -20px rgba(0,0,0,.8);padding:10px;opacity:0;transform:translateY(-6px);pointer-events:none;transition:all .2s;z-index:28}
.drop.on{opacity:1;transform:none;pointer-events:auto}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);background:var(--ash);border-radius:10px;padding:3px}
.tabs button{all:unset;cursor:pointer;text-align:center;padding:7px 0;border-radius:8px;font-weight:600;color:var(--muted)}
.tabs button.on{background:var(--raise);color:var(--cream)}
.dpane{padding:10px 2px 2px}
.quick{display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr;gap:6px}
.quick button,.opts button{all:unset;cursor:pointer;text-align:center;padding:10px 0;border-radius:10px;background:var(--ash);font-weight:650}
.quick button:hover,.opts button:hover{background:var(--raise)}
.quick button.go{background:var(--ember);color:#1B1714}
.quick button.go:hover{background:var(--ember-hot)}
.nxt{color:var(--muted);font-size:13.5px;margin-top:10px}
.nxt b{color:var(--cream)}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.opts small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.plan .pl{display:flex;align-items:center;gap:12px;padding:10px;border-radius:10px;background:var(--ash);margin-top:6px}
.plan .pl span{color:var(--muted);font-variant-numeric:tabular-nums;width:72px}
.plan .pl b{flex:1;font-weight:600}
.plan .pl button{all:unset;cursor:pointer;color:var(--ember);font-weight:650}
.plan .tl{position:relative;height:46px;margin-top:10px;border-radius:10px;background:var(--ash);overflow:hidden}
.plan .tl i{position:absolute;top:8px;bottom:8px;border-radius:6px;background:var(--ember);opacity:.85}
.plan .tl em{position:absolute;bottom:2px;font-style:normal;font-size:10px;color:var(--faint)}

/* time's up */
.up{position:absolute;left:50%;top:120px;width:440px;transform:translate(-50%,-10px);opacity:0;pointer-events:none;transition:all .3s;background:rgba(31,28,26,.98);border-radius:18px;box-shadow:0 0 0 1px rgba(242,163,110,.35),0 30px 80px -20px rgba(0,0,0,.9);padding:20px 22px;z-index:35}
.up.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.up small{font-weight:700;letter-spacing:.08em;color:var(--ember);font-size:12px}
.up h3{margin:4px 0 14px;font-size:22px;font-weight:650}
.up .row{display:flex;gap:10px}
.up button{all:unset;cursor:pointer;flex:1;text-align:center;padding:11px;border-radius:12px;background:var(--ash);font-weight:650}
.up button.go{background:var(--ember);color:#1B1714;flex:2}
.toast{position:absolute;left:50%;bottom:40px;transform:translate(-50%,10px);opacity:0;transition:all .3s;background:rgba(31,28,26,.95);box-shadow:0 0 0 1px var(--line);border-radius:999px;padding:10px 18px;font-weight:600;z-index:40;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast b{color:var(--ember)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.coach{position:absolute;left:50%;bottom:96px;transform:translateX(-50%) translateY(6px);display:flex;align-items:center;gap:12px;padding:11px 18px;border-radius:999px;background:rgba(24,21,19,.9);backdrop-filter:blur(12px);box-shadow:0 0 0 1px rgba(255,255,255,.08),0 18px 40px -18px rgba(0,0,0,.8);color:#F4EEE6;font-size:15px;font-weight:500;white-space:nowrap;z-index:60;pointer-events:none;opacity:0;transition:opacity .3s,transform .3s}
.coach.on{opacity:1;transform:translateX(-50%) translateY(0)}
.coach .st{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#FF9A4D;font-weight:700}
.coach b{color:#FF9A4D;font-weight:700}.coach kbd{font:inherit;font-size:13px;padding:2px 7px;border-radius:6px;background:rgba(255,255,255,.1)}
.others{border-bottom:1px solid var(--line)}
.oth{display:grid;grid-template-columns:10px 1fr auto auto auto;gap:10px;align-items:center;padding:7px 18px;font-size:14.5px;color:var(--muted)}
.oth i{width:8px;height:8px;border-radius:50%;background:var(--ember)}
.oth b{color:var(--cream);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.oth .r{font-variant-numeric:tabular-nums;color:var(--cream)}
.oth button{all:unset;cursor:pointer;color:var(--muted);font-weight:600}.oth button:hover{color:var(--cream)}
.tip{margin:2px 18px 8px;padding:10px 12px;border-radius:10px;background:rgba(126,207,176,.12);color:#CFEFE2;font-size:14.5px}
.bl.brk span:nth-child(3){color:#8FD9BC}
.blk.brk{background:rgba(126,207,176,.12)}.blk.brk b{color:#CFEFE2}
.opt2{all:unset;cursor:pointer;margin:12px 0 0 10px;padding:8px 14px;border-radius:12px;background:var(--ash);color:var(--muted);font-weight:600;font-size:14px}
.opt2.on{color:#CFEFE2;background:rgba(126,207,176,.14)}
.slots{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}.slots button{all:unset;cursor:pointer;padding:7px 12px;border-radius:9px;background:var(--ash);color:var(--muted);font-weight:600;font-size:14px}.slots button.on{background:var(--raise);color:var(--cream)}
.plan .tl i{cursor:grab;touch-action:none}.plan .tl i.dragging{cursor:grabbing;opacity:1;box-shadow:0 0 0 2px #fff3}
.plan h5{margin:14px 0 2px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.plan .pl small{color:var(--muted);font-size:12.5px}
.mic{all:unset;cursor:pointer;color:var(--muted);padding:6px;border-radius:8px;margin-top:4px}.mic:hover{background:var(--ash);color:var(--cream)}.mic.live{color:var(--ember);animation:breathe 1.2s infinite}
.win .tb i{cursor:pointer}.win .tb i:nth-child(1){background:#ff5f57}.win .tb i:nth-child(2){background:#febc2e}.win .tb i:nth-child(3){background:#28c840}
.win .tb{cursor:grab}.win{transition:filter .3s,opacity .25s,transform .25s}
.win.gone{opacity:0;transform:scale(.6) translateY(200px);pointer-events:none}
.win.max{left:0!important;top:28px!important;width:1280px!important;height:772px!important;border-radius:0}
.dockchip{position:absolute;left:18px;bottom:16px;display:none;align-items:center;gap:8px;padding:8px 12px;border-radius:10px;background:rgba(31,28,26,.85);color:var(--cream);font-size:13px;font-weight:600;cursor:pointer;z-index:22;box-shadow:0 0 0 1px var(--line)}
.dockchip.on{display:flex}.dockchip i{width:16px;height:12px;border-radius:2px;background:#f7f5f2}
.mbar .it,.mbar b,.mbar>svg:first-child{cursor:default;padding:2px 6px;border-radius:5px}.mbar .it.open,.mbar b.open{background:rgba(255,255,255,.16)}
.mmenu{position:absolute;top:27px;min-width:210px;background:rgba(38,34,31,.97);backdrop-filter:blur(20px);border-radius:9px;box-shadow:0 0 0 1px rgba(255,255,255,.1),0 18px 40px -10px rgba(0,0,0,.7);padding:5px;z-index:35;display:none;font-size:13.5px}
.mmenu.on{display:block}.mmenu div{padding:4px 10px;border-radius:5px;color:var(--cream)}.mmenu div.dis{color:var(--faint)}.mmenu div:not(.dis):not(.sep):hover{background:#3d6fe0;color:#fff}.mmenu .sep{height:1px;background:rgba(255,255,255,.1);margin:4px 6px;padding:0}
.ph{cursor:grab}.ph .nm{cursor:pointer}.ph .nm:hover{color:var(--cream)}
.ret{cursor:pointer}.ret:hover{color:var(--cream)}
.edb{all:unset;cursor:pointer;margin:12px 0 0 10px;padding:8px 14px;border-radius:12px;background:var(--ash);color:var(--muted);font-weight:600;font-size:14px}.edb:hover{color:var(--cream)}
.plan .pl .h{cursor:grab;color:var(--faint);width:auto}.plan .pl button+button{margin-left:4px}
.plan .tl .rz{position:absolute;right:0;top:0;bottom:0;width:8px;cursor:ew-resize;border-radius:0 6px 6px 0;background:rgba(255,255,255,.25)}
.plan .tl .nowl{position:absolute;top:0;bottom:0;width:2px;background:#fff;opacity:.6}
.ghost{position:absolute;z-index:70;pointer-events:none;padding:8px 12px;border-radius:9px;background:var(--ember);color:#1B1714;font-weight:700;font-size:14px;box-shadow:0 10px 30px -10px rgba(0,0,0,.7)}
.tl.over{box-shadow:0 0 0 2px var(--ember) inset}
.ed{position:absolute;left:50%;top:60px;width:560px;max-height:700px;overflow:auto;transform:translateX(-50%) scale(.98);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;background:rgba(31,28,26,.98);border-radius:18px;box-shadow:0 0 0 1px var(--line),0 40px 90px -20px rgba(0,0,0,.9);padding:18px 20px;z-index:45;cursor:auto}
.ed.on{opacity:1;transform:translateX(-50%);pointer-events:auto}
.ed .eh{display:flex;align-items:center;justify-content:space-between;color:var(--ember);font-weight:700;letter-spacing:.06em;font-size:13px}
.ed .eh button{all:unset;cursor:pointer;color:var(--muted);font-size:22px;padding:0 6px}
.ed input.en{all:unset;display:block;width:calc(100% - 28px);margin-top:12px;padding:10px 14px;border-radius:10px;background:var(--ash);font-size:18px;font-weight:600;color:var(--cream)}
.ed .span{display:flex;justify-content:space-between;align-items:baseline;margin:14px 2px 8px}.ed .span b{font-size:24px}.ed .span small{color:var(--muted)}
.ed .row{display:flex;align-items:center;gap:10px;margin:8px 0;color:var(--muted);font-size:14px}.ed .row>span:first-child{width:70px}
.ed .pm{all:unset;cursor:pointer;width:30px;height:30px;text-align:center;line-height:30px;border-radius:8px;background:var(--ash);color:var(--cream);font-weight:700}
.ed .pm:hover{background:var(--raise)}.ed .val{min-width:84px;text-align:center;color:var(--cream);font-weight:650}
.ed .seg2{display:inline-flex;gap:6px}.ed .seg2 button{all:unset;cursor:pointer;padding:6px 12px;border-radius:8px;background:var(--ash);color:var(--muted);font-weight:600}.ed .seg2 button.on{background:var(--ember);color:#1B1714}
.ed .bh{display:flex;justify-content:space-between;align-items:center;margin:14px 2px 6px;font-weight:650}

<script>
(function(){
function $(id){return document.getElementById(id)}
var desk=$('desk'),scr=$('scr');
function fit(){desk.style.transform='scale('+(scr.clientWidth/1280)+')';send()}
addEventListener('resize',fit);fit();

var SPEED=20; /* time runs 20× faster here, so a 25-minute block takes about a minute */
var t0=Date.now(),virt=Date.now(),lastReal=Date.now();

function hm(ms){var d=new Date(ms),h=d.getHours(),m=d.getMinutes();return (h%12||12)+':'+(m<10?'0':'')+m}

clock();setInterval(clock,1000);
var toastT;function toast(h){$('toast').innerHTML=h;$('toast').classList.add('on');clearTimeout(toastT);toastT=setTimeout(function(){$('toast').classList.remove('on')},2400)}

/* ---------- soft chime + focus sound (made on the device, like the app) ---------- */
var ac=null,noise=null;
function ctx(){if(!ac){var A=window.AudioContext||window.webkitAudioContext;if(A)ac=new A()}return ac}
function chime(){var c=ctx();if(!c)return;[523.25,659.25,783.99].forEach(function(f,i){var o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,c.currentTime+i*.16);g.gain.linearRampToValueAtTime(.08,c.currentTime+i*.16+.03);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+i*.16+1.4);o.connect(g).connect(c.destination);o.start(c.currentTime+i*.16);o.stop(c.currentTime+i*.16+1.5)})}
function startNoise(kind){var c=ctx();if(!c)return;stopNoise();var len=c.sampleRate*2,buf=c.createBuffer(1,len,c.sampleRate),d=buf.getChannelData(0),last=0;
 for(var i=0;i<len;i++){var w=Math.random()*2-1;last=(last+.02*w)/1.02;d[i]=kind==='Rain'?w*.5:last*3.5}
 var s=c.createBufferSource();s.buffer=buf;s.loop=true;var f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=kind==='Rain'?2400:kind==='Ocean'?600:kind==='Fireplace'?900:400;
 var g=c.createGain();g.gain.value=kind==='Rain'?.05:.12;s.connect(f).connect(g).connect(c.destination);
 if(kind==='Ocean'){var l=c.createOscillator(),lg=c.createGain();l.frequency.value=.12;lg.gain.value=.08;l.connect(lg).connect(g.gain);l.start();s._l=l}
 s.start();noise=s}
function stopNoise(){if(noise){try{noise.stop();noise._l&&noise._l.stop()}catch(e){}noise=null}}
$('sndTog').onclick=function(){this.classList.toggle('on');if(this.classList.contains('on')){startNoise($('sndSel').value);toast('Focus sound: <b>'+$('sndSel').value+'</b>')}else stopNoise()};
$('sndSel').onchange=function(){if($('sndTog').classList.contains('on'))startNoise(this.value)};

/* ---------- parse what you type ---------- */
function parse(txt){txt=txt.trim();if(!txt)return null;var name=null,m=txt.match(/^([^:,]{2,40}):\s*(.+)$/);if(m){name=m[1].trim();txt=m[2]}

/* ---------- launcher ---------- */

var wasOpen=false;document.addEventListener('mousedown',function(){wasOpen=$('launch').classList.contains('on')||$('drop').classList.contains('on')},true);

$('hint').onclick=openL;$('lx').onclick=closeL;
document.addEventListener('keydown',function(e){if(e.altKey&&(e.code==='Space'||e.key===' ')){e.preventDefault();openL()}else if(e.key==='Escape'){closeL();closeDrop();if(typeof closeEd==='function'&&E)closeEd();if(typeof closeMenu==='function')closeMenu()}});
(function(){var SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return;var m=$('mic');m.hidden=false;var rec=null;
 m.onclick=function(){if(rec){rec.stop();return}rec=new SR();rec.lang='en-US';rec.interimResults=true;m.classList.add('live');
  rec.onresult=function(e){var t='';for(var i=0;i<e.results.length;i++)t+=e.results[i][0].transcript;t=t.replace(/\b(\d+)\s*minutes?\b/gi,'$1m').replace(/\b(\d+)\s*hours?\b/gi,'$1h');$('li').value=t;grow();renderPrev()};
  rec.onend=function(){rec=null;m.classList.remove('live');$('li').focus()};rec.onerror=function(){toast('Couldn&rsquo;t hear that. Try typing instead.')};rec.start()}})();

function typeIn(t){var i=0;$('li').value='';(function s(){$('li').value=t.slice(0,i+=2);grow();renderPrev();if(i<t.length)setTimeout(s,16);else $('li').focus()})()}
desk.addEventListener('mousedown',function(e){if($('launch').classList.contains('on')&&!e.target.closest('.launch,.hint'))closeL();if($('drop').classList.contains('on')&&!e.target.closest('.drop,.tmb'))closeDrop()});
function renderPrev(){var p=parse($('li').value),el=$('prev');if($('launch').classList.contains('on'))coach(p?2:1);$('sugs').style.display=p?'none':'flex';if(!p){el.classList.remove('on');return}
 var tot=p.blocks.reduce(function(a,b){return a+b.mins},0),start=now(),end=start+tot*6e4,t=start;
 var h='<div class="phead"><span class="pchip">'+(p.blocks.length>1?'▥ ':'● ')+'<b>'+esc(p.name)+'</b><span>'+(p.blocks.length>1?p.blocks.length+' time blocks · ':'')+tot+'m · ends '+hm(end)+' '+ampm(end)+'</span></span><span class="ret">'+(mode==='now'?'Return to start':mode==='later'?'Return to schedule':'Return to save')+' <kbd>↩</kbd></span></div>';
 var pb=addBreaks?withBreaks(p.blocks):p.blocks;if(mode==='later'&&laterAt)t=laterAt;
 if(p.blocks.length>1)h+='<div class="blocks">'+pb.map(function(b,i){var s=(i===0&&mode!=='later')?'now':hm(t);t+=b.mins*6e4;return '<span class="blk'+(b.brk?' brk':'')+'">'+s+'<b>'+esc(b.name)+'</b>'+b.mins+'m</span>'}).join('')+'</div>';
 h+='<div class="modes"><button data-m="now" class="'+(mode==='now'?'on':'')+'">Start now</button><button data-m="later" class="'+(mode==='later'?'on':'')+'">Later today</button><button data-m="routine" class="'+(mode==='routine'?'on':'')+'">Routine</button></div>'+(p.blocks.length>1?'<button class="opt2'+(addBreaks?' on':'')+'" id="optBrk">'+(addBreaks?'✓ ':'')+'Guided breaks between blocks</button>':'');
 if(mode==='later'){var sl=slotsFrom();if(!laterAt||sl.indexOf(laterAt)<0)laterAt=sl[0];h+='<div class="slots">'+sl.map(function(x){return '<button data-at="'+x+'" class="'+(x===laterAt?'on':'')+'">'+hm(x)+' '+ampm(x)+'</button>'}).join('')+'</div>'}
 if(mode==='routine')h+='<div class="slots"><button class="on">Weekdays</button><button>Every day</button><button>Today only</button></div>';
 h+='<button class="edb" id="edBlocks">&#9998; Edit blocks</button>';
 el.innerHTML=h;el.classList.add('on');el.querySelectorAll('.modes button').forEach(function(b){b.onclick=function(){mode=b.dataset.m;renderPrev();$('li').focus()}});
 var ebt=$('edBlocks');if(ebt)ebt.onclick=function(){openEd({kind:'draft',name:p.name,blocks:addBreaks?withBreaks(p.blocks):p.blocks})};var rtn=el.querySelector('.ret');if(rtn)rtn.onclick=go;
 var ob=$('optBrk');if(ob)ob.onclick=function(){addBreaks=!addBreaks;renderPrev();$('li').focus()};
 el.querySelectorAll('.slots button').forEach(function(b){b.onclick=function(){if(b.dataset.at)laterAt=+b.dataset.at;else{el.querySelectorAll('.slots button').forEach(function(x){x.classList.remove('on')});b.classList.add('on')}if(b.dataset.at)renderPrev();$('li').focus()}})}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var planned=[{atMs:dayStart()+14*36e5,name:'Writing sprint',mins:60,blocks:[{name:'Writing',mins:20},{name:'Editing',mins:25},{name:'Reading',mins:15}]}];
function go(){var p=parse($('li').value);if(!p)return;var bl=addBreaks?withBreaks(p.blocks):p.blocks,tot=bl.reduce(function(a,b){return a+b.mins},0);
 if(mode==='later'){var at=laterAt||slotsFrom()[0];planned.push({atMs:at,name:p.name,mins:tot,blocks:bl});planned.sort(function(a,b){return a.atMs-b.atMs});closeL();$('li').value='';mode='now';toast('<b>'+esc(p.name)+'</b> planned for '+hm(at)+' '+ampm(at)+'. It starts on time.');return}
 if(mode==='routine'){routines.push({name:p.name,mins:tot,blocks:bl});closeL();$('li').value='';mode='now';toast('<b>'+esc(p.name)+'</b> saved as a weekday routine. Find it under Plan.');return}
 closeL();$('li').value='';grow();startSession(p.name,bl,false)}

/* ---------- running a session ---------- */
var running=false,paused=false,S=null;
function startSession(name,blocks,pomo){coach(blocks.length>1?3:6);ctx();if(running&&S&&!S.ended){if(paused&&pausedAt){S.blocks[S.i].end+=now()-pausedAt}others.push(S)}$('up').classList.remove('on');S={name:name,blocks:blocks.map(function(b){return {name:b.name,mins:b.mins,brk:!!b.brk||/^Break$/.test(b.name),tip:b.tip||(/^Break$/.test(b.name)?TIPS[Math.floor(Math.random()*3)][1]:'')}}),i:0,pomo:pomo,brk:false};startBlock();S.brk=S.blocks[0].brk;running=true;paused=false;$('panel').classList.add('on');$('hint').classList.add('gone');setPauseIcon();renderPanel();
 if(others.length)toast('Started <b>'+esc(name)+'</b>. '+others.length+' other timer'+(others.length>1?'s':'')+' still running.');else toast(blocks.length>1&&!pomo?'<b>'+esc(name)+'</b> · '+blocks.length+' blocks that hand off on their own':'Started <b>'+esc(blocks[0].name)+'</b>')}
function startBlock(){var b=S.blocks[S.i];b.start=now();b.end=now()+b.mins*6e4}

function tickOthers(){if(!others.length){$('others').hidden=true;return}

 $('others').hidden=!others.length;var sig=others.map(function(o){return o.name+o.i}).join('|');if($('others')._sig===sig){others.forEach(function(o,k){var r=$('others').querySelectorAll('.r')[k];if(r)r.textContent=mmss((o.blocks[o.i].end-now())/1000)});return}$('others')._sig=sig;$('others').innerHTML=others.map(function(o,k){var b=o.blocks[o.i];return '<div class="oth"><i></i><b>'+esc(b.name)+'</b><span class="r">'+mmss((b.end-now())/1000)+'</span><button data-sw="'+k+'">Show</button><button data-st="'+k+'" aria-label="Stop">✕</button></div>'}).join('');

 ed.querySelectorAll('[data-split]').forEach(function(b){b.onclick=function(){var n=+b.dataset.split,focus=W.blocks.filter(function(x){return !x.brk}).reduce(function(a,x){return a+x.mins},0),each=Math.max(1,Math.round(focus/n)),nm=W.blocks.filter(function(x){return !x.brk}).map(function(x){return x.name}),nb=[];for(var i=0;i<n;i++)nb.push({name:nm[i]||('Part '+(i+1)),mins:each});W.blocks=addBreaks?withBreaks(nb):nb;renderEd()}});
