<main>
<div class="wrap">
<section class="contact2">
 <div class="c-left">
  <p class="eyebrow">Contact</p>
  <h1>Let's <span>talk.</span></h1>
  <p class="lede">Building something, want to work together, or just up for a coffee? Send me a note. I'll write back.</p>
  <ul class="c-meta">
   <li><span>Based in</span>Vancouver, BC</li>
   <li><span>Elsewhere</span><b><a href="https://www.linkedin.com/in/nitaiweinberg/" target="_blank" rel="noopener">LinkedIn ↗</a><a href="https://buildfoundations.substack.com/" target="_blank" rel="noopener">Substack ↗</a></b></li>
  </ul>
 </div>
 <form id="f" class="c-card" action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
  <fieldset class="topics"><legend>What's it about?</legend>
   <label><input type="radio" name="topic" value="Building something" checked><span>Building something</span></label>
   <label><input type="radio" name="topic" value="Working together"><span>Working together</span></label>
   <label><input type="radio" name="topic" value="Coffee"><span>Just a coffee</span></label>
  </fieldset>
  <div class="row2">
   <label>Name<input name="name" autocomplete="name" required></label>
   <label>Email<input name="email" type="email" autocomplete="email" required></label>
  </div>
  <label>Message<textarea name="message" placeholder="A few lines is plenty." required></textarea></label>
  <div class="c-foot"><button class="btn primary" type="submit">Send message <span aria-hidden="true">→</span></button><p class="msg" id="m" role="status"></p></div>
 </form>
</section>
</div>
<script>(function(){var f=document.getElementById('f'),m=document.getElementById('m');f.addEventListener('submit',function(e){e.preventDefault();if(f.action.indexOf('YOUR_FORM_ID')>-1){m.textContent="Preview only: connect the form to send messages.";return}m.textContent='Sending…';fetch(f.action,{method:'POST',body:new FormData(f),headers:{Accept:'application/json'}}).then(function(r){m.textContent=r.ok?"Thanks! I'll get back to you soon.":"Something went wrong. Please try again.";if(r.ok)f.reset()}).catch(function(){m.textContent="Something went wrong. Please try again."})})})();</script>
